<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sastra AI - Face Reading</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
  
  <!-- Using an actively maintained fork of face-api.js for reliable model loading -->
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
  <!-- Using Puter.js for free, unlimited AI API access without CORS issues -->
  <script src="https://js.puter.com/v2/"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: #0a0a0a;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #ffffff;
      overflow-x: hidden;
    }
    
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #050505 0%, #151515 100%);
      padding: 20px;
    }
    
    .video-container {
      position: relative;
      width: 100%;
      max-width: 600px;
      aspect-ratio: 4 / 3;
      background: #111;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scaleX(-1); /* Mirror the video for a natural feel */
    }
    
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      transform: scaleX(-1);
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 10;
      padding: 20px;
    }
    
    .glass-panel {
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 25px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      max-width: 90%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .glass-panel.visible {
      opacity: 1;
      transform: translateY(0);
    }
    
    .sastra-text {
      font-size: 22px;
      font-weight: 300;
      line-height: 1.6;
      color: #e0e0e0;
    }

    .loading-text {
      font-size: 18px;
      color: #888;
      font-style: italic;
      animation: pulse 1.5s infinite;
    }
    
    .status {
      margin-top: 30px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .status-text {
      font-size: 14px;
      color: #888888;
      font-weight: 400;
      letter-spacing: 0.5px;
    }
    
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #4a9eff;
      border-radius: 50%;
      margin-right: 10px;
      box-shadow: 0 0 10px rgba(74, 158, 255, 0.5);
    }
    
    .status-dot.active {
      background: #00ff88;
      box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
      animation: pulse 2s infinite;
    }

    .status-dot.error {
      background: #ff4444;
      box-shadow: 0 0 10px rgba(255, 68, 68, 0.5);
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
    
    .controls {
      margin-top: 24px;
      display: flex;
      gap: 16px;
    }
    
    button {
      padding: 12px 24px;
      background: rgba(255,255,255,0.05);
      border: 1px solid #444444;
      color: #aaaaaa;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s ease-in-out;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    button:hover:not(:disabled) {
      border-color: #888;
      color: #ffffff;
      background: rgba(255,255,255,0.1);
    }
    
    button:active:not(:disabled) {
      transform: scale(0.97);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .info {
      margin-top: 24px;
      font-size: 13px;
      color: #555555;
      text-align: center;
      max-width: 400px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="video-container">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas"></canvas>
      <div class="overlay">
        <div class="glass-panel" id="glassPanel">
          <div class="sastra-text" id="sastraText"></div>
        </div>
      </div>
    </div>
    
    <div class="status">
      <span class="status-dot" id="statusDot"></span>
      <span class="status-text" id="statusText">Initializing AI Models...</span>
    </div>
    
    <div class="controls">
      <button id="startBtn" disabled>Start Camera</button>
      <button id="stopBtn" disabled>Stop</button>
    </div>
    
    <div class="info">
      Step into the frame. The AI will read your facial features and generate a unique Sastra prediction.
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const sastraText = document.getElementById('sastraText');
    const glassPanel = document.getElementById('glassPanel');
    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    
    let isRunning = false;
    let stream = null;
    let isReading = false; 
    let isFetching = false;
    
    // Function to call the free Puter.js AI API
    async function generateSastraFromAI() {
      // Add a random seed so the AI gives a completely unique reading every time
      const prompt = "You are a mystical Sri Lankan astrologer giving a face reading (sastra). Write exactly 2 short sentences in Sinhala. Mention a facial feature, a personality trait, and a short prediction. ONLY output Sinhala text. Make it unique. Random seed: " + Math.random();
      
      try {
        // Call Puter's AI chat model (works natively without API key or CORS issues)
        const response = await puter.ai.chat(prompt);
        
        // Parse the response based on Puter's return format
        const aiText = response?.message?.content || response;
        
        if (typeof aiText === 'string' && aiText.trim().length > 0) {
          // Clean up any stray quotes
          return aiText.trim().replace(/^["']|["']$/g, '');
        } else {
          throw new Error("Empty response from AI");
        }
      } catch (error) {
        console.error("Free AI Sastra generation failed:", error);
        // Robust fallbacks in case of network disconnects
        const fallbacks = [
            "ඔබේ දෑස්වලින් පෙනෙන්නේ ඔබ බොහෝ බාධක ජයගත් කෙනෙක් බවයි. ඉදිරි කාලයේදී ඔබට නොසිතූ දියුණුවක් හිමිවනු ඇත.",
            "ඔබේ නළල පෙන්නුම් කරන්නේ ඔබ ඉතා බුද්ධිමත් කෙනෙකු බවයි. ලඟදීම ඔබට විශාල ධනයක් ලැබීමට නියමිතයි.",
            "ඔබේ මුහුණේ හැඩය අනුව ඔබ අන් අයට ඉතා කරුණාවන්තයි. ඉක්මනින්ම ඔබට හොඳ ආරංචියක් අසන්නට ලැබේවි.",
            "ඔබේ සිනහව පිටුපස ඔබ සඟවන වේදනාවක් ඇත. නමුත් ඉදිරි මාසයේදී ඔබේ පැරණි සිහිනයක් සැබෑ වනු ඇත.",
            "ඔබේ මුහුණේ ලක්ෂණ අනුව ඔබ කිසිදා උත්සාහය අත්නොහරින කෙනෙක්. ඒ වෙනුවෙන් ඔබට නුදුරේදීම විශාල ජයග්‍රහණයක් හිමිවේ."
        ];
        return fallbacks[Math.floor(Math.random() * fallbacks.length)];
      }
    }

    async function initializeFaceApi() {
      try {
        // CRITICAL FIX: Ensure WebGL backend is ready before loading models to prevent crashes
        await faceapi.tf.setBackend('webgl');
        await faceapi.tf.ready();

        const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
        
        // Load the Tiny Face Detector (lightweight and fast)
        await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
        
        statusText.textContent = 'System Ready. Waiting for Camera.';
        startBtn.disabled = false;
      } catch (error) {
        statusText.textContent = 'Failed to load AI backend';
        statusDot.classList.add('error');
        console.error('Error loading models:', error);
      }
    }
    
    function speakText(text) {
      if ('speechSynthesis' in window) {
        // Stop any current speech
        window.speechSynthesis.cancel();
        
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'si-LK'; // Sinhala Sri Lanka
        utterance.rate = 0.85; // Slightly slower, mystical tone
        utterance.pitch = 0.8; // Deeper voice
        
        window.speechSynthesis.speak(utterance);
      }
    }

    async function startCamera() {
      try {
        // Unlock audio context on user interaction to bypass autoplay restrictions
        if ('speechSynthesis' in window) {
          const silentUtterance = new SpeechSynthesisUtterance('');
          window.speechSynthesis.speak(silentUtterance);
        }

        stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false 
        });
        
        video.srcObject = stream;
        
        video.onloadedmetadata = () => {
          video.play();
          
          // Match canvas dimensions to video
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          
          isRunning = true;
          startBtn.disabled = true;
          stopBtn.disabled = false;
          statusText.textContent = 'Scanning for faces...';
          statusDot.classList.add('active');
          
          detectFaces();
        };

      } catch (error) {
        statusText.textContent = 'Camera access denied or unavailable';
        statusDot.classList.add('error');
        console.error('Camera error:', error);
      }
    }
    
    async function detectFaces() {
      if (!isRunning) return;
      if (video.videoWidth === 0) {
        requestAnimationFrame(detectFaces);
        return;
      }
      
      try {
        // Adjusted options for better detection sensitivity
        const options = new faceapi.TinyFaceDetectorOptions({ 
          inputSize: 416, 
          scoreThreshold: 0.3 
        });
        
        const detections = await faceapi.detectAllFaces(video, options);
        
        // Clear canvas
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if (detections.length > 0) {
          // Draw subtle outline around face
          const dims = faceapi.matchDimensions(canvas, video, true);
          const resizedDetections = faceapi.resizeResults(detections, dims);
          
          ctx.strokeStyle = 'rgba(74, 158, 255, 0.4)';
          ctx.lineWidth = 2;
          ctx.strokeRect(
            resizedDetections[0].box.x, 
            resizedDetections[0].box.y, 
            resizedDetections[0].box.width, 
            resizedDetections[0].box.height
          );

          // If we found a face and aren't already reading/fetching
          if (!isReading && !isFetching) {
            isFetching = true;
            isReading = true;
            
            // Show loading state immediately
            sastraText.innerHTML = '<span class="loading-text">ඔබේ දේහ ලක්ෂණ කියවමින් පවතී...</span>';
            glassPanel.classList.add('visible');
            statusText.textContent = 'Generating Sastra...';
            
            // Fetch real AI response
            const finalSastra = await generateSastraFromAI();
            
            // Display and speak the final text
            sastraText.innerHTML = finalSastra;
            speakText(finalSastra);
            
            // Keep the text on screen for exactly 8 seconds, regardless of audio length
            setTimeout(() => {
              glassPanel.classList.remove('visible');
              statusText.textContent = 'Cooldown...';
              
              // Wait 3 more seconds before scanning again (11 seconds total cooldown)
              setTimeout(() => {
                isReading = false;
                isFetching = false;
                statusText.textContent = 'Scanning for faces...';
              }, 3000);

            }, 8000);
          }
        } 
      } catch (error) {
        console.error('Detection error:', error);
      }
      
      requestAnimationFrame(detectFaces);
    }
    
    function stopCamera() {
      isRunning = false;
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
      video.srcObject = null;
      glassPanel.classList.remove('visible');
      startBtn.disabled = false;
      stopBtn.disabled = true;
      statusText.textContent = 'Camera stopped';
      statusDot.classList.remove('active');
      
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      window.speechSynthesis.cancel();
      isReading = false;
      isFetching = false;
    }
    
    startBtn.addEventListener('click', startCamera);
    stopBtn.addEventListener('click', stopCamera);
    
    // Start initialization when script loads
    initializeFaceApi();
  </script>
</body>
</html>
