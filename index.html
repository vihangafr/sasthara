<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sastra Face AI</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
  
  <!-- Using an actively maintained fork of face-api.js for reliable model loading -->
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>

  <style>
    :root {
      --bg-color: #050505;
      --container-bg: #0f0f0f;
      --text-main: #ffffff;
      --text-muted: #666666;
      --accent: #ffffff;
      --border: rgba(255, 255, 255, 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background-color: var(--bg-color);
      font-family: 'Inter', -apple-system, sans-serif;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 2rem;
      max-width: 800px;
    }
    
    .video-wrapper {
      position: relative;
      width: 100%;
      max-width: 560px;
      aspect-ratio: 4 / 3;
      background: var(--container-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border);
      transition: border-color 0.4s ease;
    }
    
    .video-wrapper.detecting {
      border-color: rgba(255, 255, 255, 0.3);
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scaleX(-1); /* Mirror the video for natural feel */
      filter: grayscale(20%) contrast(110%);
      position: relative;
      z-index: 1;
    }
    
    #overlayCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
      transform: scaleX(-1); /* Match video mirror */
    }
    
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      background: radial-gradient(circle, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.8) 100%);
      z-index: 10;
    }
    
    .sastra-text {
      font-size: clamp(1rem, 2.5vw, 1.4rem);
      font-weight: 300;
      letter-spacing: 0.05em;
      color: var(--text-main);
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      text-shadow: 0 4px 20px rgba(0,0,0,0.9);
      z-index: 20;
      text-align: center;
      max-width: 90%;
      line-height: 1.8;
      background: rgba(0, 0, 0, 0.6);
      padding: 1.5rem;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(4px);
    }
    
    .sastra-text.visible {
      opacity: 1;
      transform: translateY(0);
    }
    
    .sastra-text.visible {
      opacity: 1;
      transform: translateY(0);
      letter-spacing: 0.15em;
    }
    
    .status-panel {
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    
    .status-dot {
      width: 6px;
      height: 6px;
      background: var(--text-muted);
      border-radius: 50%;
      transition: background-color 0.3s ease;
    }

    .status-dot.active {
      background: #4ade80;
      box-shadow: 0 0 10px rgba(74, 222, 128, 0.5);
      animation: pulse 2s infinite ease-in-out;
    }
    
    .status-dot.loading {
      background: #60a5fa;
      box-shadow: 0 0 10px rgba(96, 165, 250, 0.5);
      animation: pulse 1s infinite ease-in-out;
    }
    
    .status-text {
      font-size: 0.875rem;
      color: var(--text-muted);
      font-weight: 300;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    
    .controls {
      display: flex;
      gap: 1rem;
    }
    
    button {
      padding: 0.75rem 2rem;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 400;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-family: inherit;
    }
    
    button:hover:not(:disabled) {
      border-color: var(--text-main);
      color: var(--text-main);
      background: rgba(255,255,255,0.02);
    }
    
    button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    
    .info {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #444;
      text-align: center;
      max-width: 400px;
      line-height: 1.6;
      font-weight: 300;
    }

    /* Media query for smaller screens */
    @media (max-width: 600px) {
      .container { padding: 1rem; }
      .video-wrapper { border-radius: 8px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="video-wrapper" id="videoWrapper">
      <video id="video" autoplay muted playsinline></video>
      <canvas id="overlayCanvas"></canvas>
      <div class="overlay">
        <div class="sastra-text" id="sastraText"></div>
      </div>
    </div>
    
    <div class="status-panel">
      <div class="status-indicator">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-text" id="statusText">Initializing AI...</span>
      </div>
      
      <div class="controls">
        <button id="startBtn" disabled>Start Camera</button>
        <button id="stopBtn" disabled>Stop</button>
      </div>
    </div>
    
    <div class="info">
      Please grant camera access when prompted. The AI model runs entirely locally in your browser and will display "Sastra" when a human face is detected.
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const overlayCanvas = document.getElementById('overlayCanvas');
    const videoWrapper = document.getElementById('videoWrapper');
    const sastraText = document.getElementById('sastraText');
    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    
    let isRunning = false;
    let stream = null;
    let detectionLoop = null;
    let isReading = false; 
    let isFetching = false; // Added to prevent multiple API calls at once
    
    // Function to call a FREE AI API (Pollinations) that requires NO API KEY
    async function generateSastraFromAI() {
      // Add a random seed so the AI doesn't cache the response and gives a unique reading every time
      const prompt = "You are a mystical Sri Lankan astrologer giving a face reading (sastra). Write exactly 2 short sentences in Sinhala. Mention a facial feature, a personality trait, and a short prediction. ONLY output Sinhala text. Make it unique. Random seed: " + Math.random();
      
      try {
        const response = await fetch('https://text.pollinations.ai/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            messages: [
              { role: 'user', content: prompt }
            ],
            model: 'mistral' // Explicitly request a smart model that understands Sinhala
          }),
        });
        
        if (!response.ok) {
          throw new Error("Network response was not ok");
        }
        
        const aiText = await response.text();
        
        if (aiText && aiText.trim().length > 0) {
          return aiText.trim();
        } else {
          throw new Error("Empty response from AI");
        }
      } catch (error) {
        console.error("Free AI Sastra generation failed:", error);
        // Fallback readings just in case of network issues or if the API is blocked by the browser
        const fallbacks = [
            "ඔබේ දෑස්වලින් පෙනෙන්නේ ඔබ බොහෝ බාධක ජයගත් කෙනෙක් බවයි. ඉදිරි කාලයේදී ඔබට නොසිතූ දියුණුවක් හිමිවනු ඇත.",
            "ඔබේ නළල පෙන්නුම් කරන්නේ ඔබ ඉතා බුද්ධිමත් කෙනෙකු බවයි. ලඟදීම ඔබට විශාල ධනයක් ලැබීමට නියමිතයි.",
            "ඔබේ මුහුණේ හැඩය අනුව ඔබ අන් අයට ඉතා කරුණාවන්තයි. ඉක්මනින්ම ඔබට හොඳ ආරංචියක් අසන්නට ලැබේවි.",
            "ඔබේ සිනහව පිටුපස ඔබ සඟවන වේදනාවක් ඇත. නමුත් ඉදිරි මාසයේදී ඔබේ පැරණි සිහිනයක් සැබෑ වනු ඇත.",
            "ඔබේ මුහුණේ ලක්ෂණ අනුව ඔබ කිසිදා උත්සාහය අත්නොහරින කෙනෙක්. ඒ වෙනුවෙන් ඔබට නුදුරේදීම විශාල ජයග්‍රහණයක් හිමිවේ."
        ];
        return fallbacks[Math.floor(Math.random() * fallbacks.length)];
      }
    }

    const options = new faceapi.TinyFaceDetectorOptions({ 
      inputSize: 416, 
      scoreThreshold: 0.2 
    });
    
    async function initializeFaceApi() {
      try {
        statusDot.className = 'status-dot loading';
        
        // Switch to the most universally reliable CDN for these weights
        const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';
        
        await faceapi.tf.setBackend('webgl');
        await faceapi.tf.ready();
        
        await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
        
        updateStatus('Ready', 'status-dot');
        startBtn.disabled = false;
      } catch (error) {
        updateStatus('Model loading failed', 'status-dot');
        console.error('Error loading models:', error);
      }
    }
    
    async function startCamera() {
      try {
        updateStatus('Requesting camera...', 'status-dot loading');
        
        stream = await navigator.mediaDevices.getUserMedia({ 
          video: { 
            facingMode: 'user', 
            width: { ideal: 640 }, 
            height: { ideal: 480 } 
          },
          audio: false 
        });
        
        video.srcObject = stream;
        
        // Wait for metadata to ensure the video has dimensions, then force play
        video.onloadedmetadata = async () => {
          try {
            // Critical fix for face-api: explicitly set intrinsic dimensions
            video.width = video.videoWidth;
            video.height = video.videoHeight;
            overlayCanvas.width = video.videoWidth;
            overlayCanvas.height = video.videoHeight;
            
            await video.play();
            isRunning = true;
            startBtn.disabled = true;
            stopBtn.disabled = false;
            updateStatus('Detecting', 'status-dot active');
            detectFaces();
          } catch (playError) {
            console.error('Video playback failed:', playError);
            updateStatus('Playback error', 'status-dot');
          }
        };

      } catch (error) {
        updateStatus('Camera access denied', 'status-dot');
        console.error('Camera error:', error);
      }
    }
    
    async function detectFaces() {
      if (!isRunning || video.paused || video.ended) return;
      
      try {
        // Ensure the video has actual dimensions before passing to TensorFlow
        if (video.videoWidth > 0 && video.videoHeight > 0) {
          const detections = await faceapi.detectAllFaces(video, options);
          
          // Clear the canvas each frame
          const ctx = overlayCanvas.getContext('2d');
          ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
          
          if (detections && detections.length > 0) {
            // Draw a visual box so you can see if the AI is actually working
            const resizedDetections = faceapi.resizeResults(detections, { width: video.width, height: video.height });
            faceapi.draw.drawDetections(overlayCanvas, resizedDetections);
            
            videoWrapper.classList.add('detecting');
            
            // Generate reading only if not already fetching or reading
            if (!isReading && !isFetching) {
              isFetching = true;
              
              // Show a loading/mystical state while the AI thinks
              sastraText.textContent = "ඔබේ දේහ ලක්ෂණ කියවමින් පවතී..."; // "Reading your features..."
              sastraText.classList.add('visible');
              
              // Call the free AI
              generateSastraFromAI().then(aiSastra => {
                isFetching = false;
                isReading = true;
                
                // Update text on screen with the real AI response
                sastraText.textContent = aiSastra;
                
                // Attempt to speak (Wrapped in try/catch so it doesn't break if Sinhala isn't supported)
                try {
                  const utterance = new SpeechSynthesisUtterance(aiSastra);
                  utterance.lang = 'si-LK'; 
                  utterance.pitch = 0.4; 
                  utterance.rate = 0.8;  
                  window.speechSynthesis.speak(utterance);
                } catch(err) {
                  console.warn("Text-to-speech failed or unsupported:", err);
                }
                
                // FIX: Use a guaranteed timer to remove the text, rather than waiting for speech to finish.
                // This ensures the app never freezes if the device lacks a Sinhala voice.
                setTimeout(() => {
                  sastraText.classList.remove('visible');
                  // Add a cooldown before the next reading
                  setTimeout(() => { isReading = false; }, 4000);
                }, 8000); // Keep text on screen for 8 seconds
              });
            }
          } else {
            // Only hide the text if the AI is not currently speaking or thinking
            if (!isReading && !isFetching) {
              sastraText.classList.remove('visible');
              videoWrapper.classList.remove('detecting');
            }
          }
        }
      } catch (error) {
        console.warn('Detection skipped this frame:', error);
        updateStatus('Detection error', 'status-dot');
      }
      
      if (isRunning) {
        detectionLoop = requestAnimationFrame(detectFaces);
      }
    }
    
    function stopCamera() {
      isRunning = false;
      isReading = false;
      isFetching = false;
      window.speechSynthesis.cancel(); // Stop any ongoing speech
      
      if (detectionLoop) {
        cancelAnimationFrame(detectionLoop);
      }
      
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
      
      video.srcObject = null;
      const ctx = overlayCanvas.getContext('2d');
      ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
      sastraText.classList.remove('visible');
      videoWrapper.classList.remove('detecting');
      
      startBtn.disabled = false;
      stopBtn.disabled = true;
      updateStatus('Camera stopped', 'status-dot');
    }

    function updateStatus(text, dotClass) {
      statusText.textContent = text;
      statusDot.className = dotClass;
    }
    
    // Unlock speech synthesis immediately on user interaction (fixes browser audio blocking)
    startBtn.addEventListener('click', () => {
       const unlock = new SpeechSynthesisUtterance('');
       window.speechSynthesis.speak(unlock);
       startCamera();
    });
    stopBtn.addEventListener('click', stopCamera);
    
    window.addEventListener('DOMContentLoaded', initializeFaceApi);

  </script>
</body>
</html>
