<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  
  body {
    background: #0a0a0a;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #ffffff;
  }
  
  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
    padding: 20px;
  }
  
  .video-container {
    position: relative;
    width: 100%;
    max-width: 500px;
    aspect-ratio: 4 / 3;
    background: #1a1a1a;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
  }
  
  #video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  
  .overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  
  .sastra-text {
    font-size: 72px;
    font-weight: 300;
    letter-spacing: 2px;
    color: #ffffff;
    opacity: 0;
    transition: opacity 0.3s ease-in-out;
    text-transform: uppercase;
  }
  
  .sastra-text.visible {
    opacity: 1;
  }
  
  .status {
    margin-top: 24px;
    text-align: center;
  }
  
  .status-text {
    font-size: 14px;
    color: #888888;
    font-weight: 400;
    letter-spacing: 0.5px;
  }
  
  .status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: #4a9eff;
    border-radius: 50%;
    margin-right: 8px;
    animation: pulse 2s infinite;
  }
  
  @keyframes pulse {
    0%, 100% {
      opacity: 0.5;
    }
    50% {
      opacity: 1;
    }
  }
  
  .controls {
    margin-top: 24px;
    display: flex;
    gap: 12px;
  }
  
  button {
    padding: 10px 20px;
    background: transparent;
    border: 1px solid #444444;
    color: #888888;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s ease-in-out;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  
  button:hover {
    border-color: #666666;
    color: #cccccc;
  }
  
  button:active {
    scale: 0.98;
  }
  
  .info {
    margin-top: 20px;
    font-size: 12px;
    color: #666666;
    text-align: center;
    max-width: 400px;
  }
</style>

<div class="container">
  <div class="video-container">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" style="display: none;"></canvas>
    <div class="overlay">
      <div class="sastra-text" id="sastraText">Sastra</div>
    </div>
  </div>
  
  <div class="status">
    <span class="status-dot"></span>
    <span class="status-text" id="statusText">Initializing...</span>
  </div>
  
  <div class="controls">
    <button id="startBtn">Start</button>
    <button id="stopBtn" disabled>Stop</button>
  </div>
  
  <div class="info">
    Grant camera access to enable face detection. The AI will display "Sastra" when faces are detected.
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/face-api.js/0.22.2/face-api.min.js"></script>
<script>
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const sastraText = document.getElementById('sastraText');
  const statusText = document.getElementById('statusText');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  
  let isRunning = false;
  let stream = null;
  
  async function initializeFaceApi() {
    try {
      const MODEL_URL = 'https://cdnjs.cloudflare.com/ajax/libs/face-api.js/0.22.2/weights/';
      await Promise.all([
        faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
        faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
      ]);
      statusText.textContent = 'Ready to detect faces';
      startBtn.disabled = false;
    } catch (error) {
      statusText.textContent = 'Failed to load face detection models';
      console.error('Error loading models:', error);
    }
  }
  
  async function startCamera() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
        audio: false 
      });
      video.srcObject = stream;
      isRunning = true;
      startBtn.disabled = true;
      stopBtn.disabled = false;
      statusText.textContent = 'Camera active';
      detectFaces();
    } catch (error) {
      statusText.textContent = 'Camera access denied';
      console.error('Camera error:', error);
    }
  }
  
  async function detectFaces() {
    if (!isRunning) return;
    
    try {
      const detections = await faceapi.detectAllFaces(
        video,
        new faceapi.TinyFaceDetectorOptions()
      );
      
      if (detections.length > 0) {
        sastraText.classList.add('visible');
      } else {
        sastraText.classList.remove('visible');
      }
    } catch (error) {
      console.error('Detection error:', error);
    }
    
    requestAnimationFrame(detectFaces);
  }
  
  function stopCamera() {
    isRunning = false;
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
    }
    video.srcObject = null;
    sastraText.classList.remove('visible');
    startBtn.disabled = false;
    stopBtn.disabled = true;
    statusText.textContent = 'Camera stopped';
  }
  
  startBtn.addEventListener('click', startCamera);
  stopBtn.addEventListener('click', stopCamera);
  
  initializeFaceApi();
</script>
