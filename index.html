<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sastra AI</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts for clean typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400&display=swap" rel="stylesheet">
    
    <!-- MediaPipe AI Libraries (Version Pinned for 100% Reliability) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection@0.4.1646425229/face_detection.js" crossorigin="anonymous"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #030303;
            color: #ffffff;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        /* Subtle glow for the main text */
        .glow-text {
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
        }

        /* Smooth fade transitions */
        .fade-enter {
            opacity: 0;
            transform: scale(0.95) translateY(10px);
            transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .fade-enter-active {
            opacity: 1;
            transform: scale(1) translateY(0);
        }
        .fade-exit {
            opacity: 1;
            transform: scale(1) translateY(0);
            transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .fade-exit-active {
            opacity: 0;
            transform: scale(1.05) translateY(-10px);
        }

        /* Blinking indicator */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .animate-blink {
            animation: blink 2s infinite ease-in-out;
        }

        /* Progress Bar Styling */
        #progress_container {
            width: 200px;
            height: 2px;
            background-color: #1a1a1a;
            margin-top: 1rem;
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        #progress_bar {
            height: 100%;
            width: 0%;
            background-color: #555;
            transition: width 0.3s ease-out;
        }

        /* Camera feed styling */
        #video_feed {
            filter: grayscale(100%) contrast(120%) brightness(80%);
            /* Removed the heavy mask to make the face clearly visible */
            border-radius: 50%;
            border: 1px solid #333;
        }
        
        /* Face tracking box overlay */
        .tracking-box {
            position: absolute;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.05);
            pointer-events: none;
            transition: all 0.1s ease-out;
            z-index: 20;
        }
    </style>
</head>
<body class="h-[100dvh] w-screen flex flex-col items-center justify-center bg-[#030303] relative">

    <!-- Top Left Status Indicator -->
    <div class="absolute top-6 left-6 flex items-center gap-3 text-xs tracking-[0.2em] text-neutral-500 font-light z-10">
        <div id="status_dot" class="w-1.5 h-1.5 rounded-full bg-neutral-700"></div>
        <span id="status_text">SYSTEM IDLE</span>
    </div>

    <!-- Main Content Area -->
    <div class="relative w-full h-full flex items-center justify-center z-20">
        
        <!-- Start Button -->
        <button id="start_btn" class="px-8 py-3 border border-neutral-800 text-neutral-400 text-sm tracking-[0.3em] uppercase rounded-full hover:bg-white hover:text-black transition-all duration-500">
            Initiate Vision
        </button>

        <!-- Loading Text -->
        <div id="loading_section" class="hidden absolute flex flex-col items-center">
            <div id="loading_text" class="text-neutral-600 text-sm tracking-[0.4em] font-light animate-pulse">
                AWAKENING NEURAL NET...
            </div>
            <div id="progress_container">
                <div id="progress_bar"></div>
            </div>
            <div id="progress_text" class="text-neutral-700 text-[10px] tracking-widest mt-2">0%</div>
        </div>

        <!-- The Target Word -->
        <h1 id="sastra_text" class="hidden absolute text-7xl md:text-9xl font-thin tracking-[0.3em] uppercase text-white glow-text fade-enter">
            Sastra
        </h1>

        <!-- Error Message Box -->
        <div id="error_box" class="hidden absolute flex flex-col items-center text-red-900 gap-4">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
            <span id="error_message" class="text-xs tracking-[0.2em]">CAMERA ACCESS DENIED</span>
        </div>
    </div>

    <!-- Visible Video Element for Face Preview (Adjusted to 4:3 Aspect Ratio to prevent bounding box offset) -->
    <div class="absolute bottom-8 right-8 w-48 h-36 md:w-64 md:h-48 rounded-xl overflow-hidden opacity-0 transition-opacity duration-1000 z-30 shadow-[0_0_30px_rgba(255,255,255,0.05)] border border-neutral-800" id="video_container">
        <video id="input_video" class="w-full h-full object-cover transform scale-x-[-1] filter grayscale contrast-125 brightness-90" autoplay muted playsinline webkit-playsinline></video>
        <!-- Overlay container for drawing bounding boxes -->
        <div id="tracking_overlay" class="absolute inset-0 w-full h-full transform scale-x-[-1]"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const startBtn = document.getElementById('start_btn');
            const loadingSection = document.getElementById('loading_section');
            const progressBar = document.getElementById('progress_bar');
            const progressText = document.getElementById('progress_text');
            const sastraText = document.getElementById('sastra_text');
            const videoElement = document.getElementById('input_video');
            const videoContainer = document.getElementById('video_container');
            const trackingOverlay = document.getElementById('tracking_overlay');
            const statusDot = document.getElementById('status_dot');
            const statusText = document.getElementById('status_text');
            const errorBox = document.getElementById('error_box');
            const errorMessage = document.getElementById('error_message');

            let faceTimeout = null;
            let isFaceCurrentlyVisible = false;
            let aiInitialized = false;
            let boundingBoxElement = null;
            
            let targetProgress = 0;
            let currentProgress = 0;

            // Update UI State Helper
            const setStatus = (state) => {
                switch(state) {
                    case 'IDLE':
                        statusDot.className = 'w-1.5 h-1.5 rounded-full bg-neutral-700';
                        statusText.innerText = 'SYSTEM IDLE';
                        break;
                    case 'LOADING':
                        statusDot.className = 'w-1.5 h-1.5 rounded-full bg-yellow-600 animate-blink';
                        statusText.innerText = 'LOADING ASSETS...';
                        break;
                    case 'CALIBRATING':
                        statusDot.className = 'w-1.5 h-1.5 rounded-full bg-yellow-600 animate-blink';
                        statusText.innerText = 'CALIBRATING SENSOR...';
                        break;
                    case 'ACTIVE':
                        statusDot.className = 'w-1.5 h-1.5 rounded-full bg-neutral-500 animate-blink';
                        statusText.innerText = 'VISION ACTIVE';
                        break;
                    case 'DETECTED':
                        statusDot.className = 'w-1.5 h-1.5 rounded-full bg-white';
                        statusText.innerText = 'SUBJECT LOCKED';
                        break;
                    case 'ERROR':
                        statusDot.className = 'w-1.5 h-1.5 rounded-full bg-red-900';
                        statusText.innerText = 'SYSTEM FAULT';
                        break;
                }
            };

            // Smooth progress bar animator
            const updateProgress = () => {
                currentProgress += (targetProgress - currentProgress) * 0.05; // Ease towards target
                
                // Hard cap at 99% until the AI actually confirms it's working
                if (currentProgress > 99 && !aiInitialized) currentProgress = 99; 
                
                progressBar.style.width = `${currentProgress}%`;
                progressText.innerText = `${Math.floor(currentProgress)}%`;
                
                if (currentProgress < 99.9 || !aiInitialized) {
                    requestAnimationFrame(updateProgress);
                } else {
                    progressBar.style.width = `100%`;
                    progressText.innerText = `100%`;
                }
            };

            const faceDetection = new FaceDetection({locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection@0.4.1646425229/${file}`;
            }});

            faceDetection.setOptions({
                modelSelection: 0,
                minDetectionConfidence: 0.6
            });

            faceDetection.onResults((results) => {
                if (!aiInitialized) {
                    // AI is officially working! Push progress to 100%
                    aiInitialized = true;
                    targetProgress = 100;
                    
                    // Small delay to let the user see the 100% text before switching UI
                    setTimeout(() => {
                        loadingSection.classList.add('hidden');
                        videoContainer.classList.remove('opacity-0');
                        videoContainer.classList.add('opacity-100');
                        setStatus('ACTIVE');
                    }, 500);
                }

                const hasFace = results.detections && results.detections.length > 0;

                if (hasFace) {
                    if (faceTimeout) {
                        clearTimeout(faceTimeout); 
                        faceTimeout = null;
                    }
                    
                    const detection = results.detections[0];
                    const boundingBox = detection.boundingBox;
                    
                    if (!boundingBoxElement) {
                        boundingBoxElement = document.createElement('div');
                        boundingBoxElement.className = 'tracking-box';
                        boundingBoxElement.style.borderRadius = '4px';
                        boundingBoxElement.style.transition = 'all 0.1s linear';
                        trackingOverlay.appendChild(boundingBoxElement);
                    }
                    
                    const xMin = boundingBox.xMin !== undefined ? boundingBox.xMin : (boundingBox.xCenter - boundingBox.width / 2);
                    const yMin = boundingBox.yMin !== undefined ? boundingBox.yMin : (boundingBox.yCenter - boundingBox.height / 2);

                    boundingBoxElement.style.left = `${xMin * 100}%`;
                    boundingBoxElement.style.top = `${yMin * 100}%`;
                    boundingBoxElement.style.width = `${boundingBox.width * 100}%`;
                    boundingBoxElement.style.height = `${boundingBox.height * 100}%`;
                    boundingBoxElement.style.opacity = '1';

                    if (!isFaceCurrentlyVisible) {
                        isFaceCurrentlyVisible = true;
                        sastraText.classList.remove('hidden', 'fade-exit', 'fade-exit-active');
                        sastraText.classList.add('fade-enter');
                        requestAnimationFrame(() => {
                            sastraText.classList.add('fade-enter-active');
                        });
                        setStatus('DETECTED');
                    }
                } else {
                    if (boundingBoxElement) boundingBoxElement.style.opacity = '0';

                    if (isFaceCurrentlyVisible && !faceTimeout) {
                        faceTimeout = setTimeout(() => {
                            isFaceCurrentlyVisible = false;
                            sastraText.classList.remove('fade-enter', 'fade-enter-active');
                            sastraText.classList.add('fade-exit');
                            
                            requestAnimationFrame(() => {
                                sastraText.classList.add('fade-exit-active');
                                setTimeout(() => {
                                    if (!isFaceCurrentlyVisible) sastraText.classList.add('hidden');
                                }, 800);
                            });

                            setStatus('ACTIVE');
                            faceTimeout = null;
                        }, 500);
                    }
                }
            });

            startBtn.addEventListener('click', async () => {
                startBtn.classList.add('hidden');
                loadingSection.classList.remove('hidden');
                setStatus('LOADING');

                // Start progress animation
                targetProgress = 30; // Requesting permissions phase
                requestAnimationFrame(updateProgress);

                try {
                    // Force strict iOS attributes directly in JS
                    videoElement.setAttribute('autoplay', '');
                    videoElement.setAttribute('muted', '');
                    videoElement.setAttribute('playsinline', '');

                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user" } 
                    });
                    videoElement.srcObject = stream;
                    
                    targetProgress = 60; // Camera acquired, waiting for buffer

                    await new Promise((resolve) => {
                        videoElement.onloadedmetadata = () => {
                            videoElement.play().catch(e => console.error("Play error:", e));
                        };
                        
                        const checkVideoDimensions = () => {
                            if (videoElement.readyState >= 2 && videoElement.videoWidth > 0) {
                                videoElement.width = videoElement.videoWidth;
                                videoElement.height = videoElement.videoHeight;
                                resolve();
                            } else {
                                requestAnimationFrame(checkVideoDimensions);
                            }
                        };
                        checkVideoDimensions();
                    });

                    targetProgress = 95; // Video playing, downloading AI models
                    setStatus('CALIBRATING');

                    // Create an invisible canvas. Drawing video to canvas first prevents 
                    // 99% of iOS WebGL crashes when passing data to the AI model.
                    const offscreenCanvas = document.createElement('canvas');
                    const ctx = offscreenCanvas.getContext('2d', { willReadFrequently: true });
                    
                    let isDetecting = false;
                    let consecutiveErrors = 0;

                    const processFrame = async () => {
                        if (!videoElement.paused && !videoElement.ended && videoElement.readyState >= 2) {
                            if (!isDetecting) {
                                isDetecting = true;
                                try {
                                    // 1. Draw safe image to canvas
                                    offscreenCanvas.width = videoElement.videoWidth;
                                    offscreenCanvas.height = videoElement.videoHeight;
                                    ctx.drawImage(videoElement, 0, 0, offscreenCanvas.width, offscreenCanvas.height);
                                    
                                    // 2. Send perfectly clean canvas to AI
                                    await faceDetection.send({ image: offscreenCanvas });
                                    consecutiveErrors = 0; // Reset errors on success
                                } catch (e) {
                                    console.error("AI Error:", e);
                                    consecutiveErrors++;
                                    
                                    // If AI fails multiple times in a row, halt and show error
                                    if (!aiInitialized && consecutiveErrors > 5) {
                                        loadingSection.classList.add('hidden');
                                        errorBox.classList.remove('hidden');
                                        errorMessage.innerText = "AI INITIALIZATION FAILED";
                                        setStatus('ERROR');
                                        return; // Kill the loop entirely
                                    }
                                }
                                isDetecting = false;
                            }
                        }
                        
                        // Continue loop using optimal frame timing API if available
                        if (aiInitialized || consecutiveErrors <= 5) {
                            if (videoElement.requestVideoFrameCallback) {
                                videoElement.requestVideoFrameCallback(processFrame);
                            } else {
                                requestAnimationFrame(processFrame);
                            }
                        }
                    };
                    
                    // Ignite loop
                    processFrame();

                } catch (error) {
                    console.error("Camera Error:", error);
                    targetProgress = 0; // Reset progress
                    loadingSection.classList.add('hidden');
                    errorBox.classList.remove('hidden');
                    setStatus('ERROR');
                    
                    if (error.name === 'NotAllowedError') {
                        errorMessage.innerText = "CAMERA ACCESS DENIED";
                    } else {
                        errorMessage.innerText = "HARDWARE UNAVAILABLE";
                    }
                }
            });
        });
    </script>
</body>
</html>
